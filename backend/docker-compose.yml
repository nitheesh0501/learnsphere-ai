version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=learnsphere-production-secret-key-2026
      - JWT_SECRET_KEY=learnsphere-jwt-secret-key-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./uploads:/app/uploads
      - ./learnsphere.db:/app/learnsphere.db
